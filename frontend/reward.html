<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewards | ShopXP</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
}

.navbar{
    background:#111827;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.navbar a{
    color:#38bdf8;
    text-decoration:none;
    margin-left:15px;
}

.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.level-card{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    padding:30px;
    border-radius:15px;
    text-align:center;
}

.level-badge{
    font-size:22px;
    font-weight:bold;
    background:#f59e0b;
    display:inline-block;
    padding:8px 20px;
    border-radius:30px;
    margin-bottom:15px;
}

.progress-container{
    background:#1f2937;
    height:22px;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22d3ee,#3b82f6);
    transition:1s;
}

.reward-list{
    margin-top:30px;
}

.reward-item{
    background:#1f2937;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.reward-item button{
    padding:6px 15px;
    border:none;
    background:#22c55e;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.reward-item button:disabled{
    background:gray;
}

.footer{
    text-align:center;
    margin-top:40px;
    padding:20px;
    background:#111827;
}
</style>
</head>

<body>

<div class="navbar">
    <div>🔥 ShopXP Rewards</div>
    <div>
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </div>
</div>

<div class="container">

    <div class="level-card">
        <div class="level-badge" id="levelBadge">Level 1</div>
        <h2>Total XP: <span id="xp">0</span></h2>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p id="nextLevelText"></p>
    </div>

    <div class="reward-list">
        <h3>🎁 Level Rewards</h3>

        <div class="reward-item">
            <div>
                <div style="font-weight:bold;">Level 2 — ₹100 Voucher</div>
                <div style="font-size:12px;color:#94a3b8;margin-top:4px;">Requires 500 XP (Level 2)</div>
            </div>
            <button id="reward2" onclick="claimReward(2)">Claim</button>
        </div>

        <div class="reward-item">
            <div>
                <div style="font-weight:bold;">Level 3 — Free Earphones</div>
                <div style="font-size:12px;color:#94a3b8;margin-top:4px;">Requires 1000 XP (Level 3)</div>
            </div>
            <button id="reward3" onclick="claimReward(3)">Claim</button>
        </div>

        <div class="reward-item">
            <div>
                <div style="font-weight:bold;">Level 5 — ₹500 Voucher</div>
                <div style="font-size:12px;color:#94a3b8;margin-top:4px;">Requires 2000 XP (Level 5)</div>
            </div>
            <button id="reward5" onclick="claimReward(5)">Claim</button>
        </div>

    </div>

</div>

<div class="footer">
© 2026 ShopXP Rewards
</div>

<script src="script.js"></script>

</body>
</html>
