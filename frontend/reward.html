<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewards | ShopXP</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
}

.navbar{
    background:#111827;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.navbar a{
    color:#38bdf8;
    text-decoration:none;
    margin-left:15px;
}

.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.level-card{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    padding:30px;
    border-radius:15px;
    text-align:center;
}

.level-badge{
    font-size:22px;
    font-weight:bold;
    background:#f59e0b;
    display:inline-block;
    padding:8px 20px;
    border-radius:30px;
    margin-bottom:15px;
}

.progress-container{
    background:#1f2937;
    height:22px;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22d3ee,#3b82f6);
    transition:1s;
}

.reward-list{
    margin-top:30px;
}

.reward-item{
    background:#1f2937;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.reward-item button{
    padding:6px 15px;
    border:none;
    background:#22c55e;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.reward-item button:disabled{
    background:gray;
}

.footer{
    text-align:center;
    margin-top:40px;
    padding:20px;
    background:#111827;
}
</style>
</head>

<body>

<div class="navbar">
    <div>🔥 ShopXP Rewards</div>
    <div>
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </div>
</div>

<div class="container">

    <div class="level-card">
        <div class="level-badge" id="levelBadge">Level 1</div>
        <h2>Total XP: <span id="xp">0</span></h2>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p id="nextLevelText"></p>
    </div>

    <div class="reward-list">
        <h3>🎁 Level Rewards</h3>

        <div class="reward-item">
            <span>Level 2 - ₹100 Voucher</span>
            <button id="reward2" onclick="claimReward(2)">Claim</button>
        </div>

        <div class="reward-item">
            <span>Level 3 - Free Earphones</span>
            <button id="reward3" onclick="claimReward(3)">Claim</button>
        </div>

        <div class="reward-item">
            <span>Level 5 - ₹500 Voucher</span>
            <button id="reward5" onclick="claimReward(5)">Claim</button>
        </div>

    </div>

</div>

<div class="footer">
© 2026 ShopXP Rewards
</div>

<script src="script.js"></script>

<script>
// ===== LOGIN CHECK =====
const user = JSON.parse(localStorage.getItem("user"));
if(!user){
    window.location.href = "login.html";
}

// ===== XP SYSTEM =====
function getXP(){
    return parseInt(localStorage.getItem("xp")) || 0;
}

function getLevel(xp){
    return Math.floor(xp / 500) + 1; 
}

// ===== LOAD UI =====
function loadRewards(){

    let xp = getXP();
    let level = getLevel(xp);

    document.getElementById("xp").innerText = xp;
    document.getElementById("levelBadge").innerText = "Level " + level;

    let percent = ((xp % 500) / 500) * 100;
    document.getElementById("progressBar").style.width = percent + "%";

    document.getElementById("nextLevelText").innerText =
        (500 - (xp % 500)) + " XP to next level";

    checkRewardAccess(level);
    updateCartCount();
}

// ===== ENABLE BUTTONS =====
function checkRewardAccess(level){
    let claimed = JSON.parse(localStorage.getItem("claimedRewards")) || [];

    [2,3,5].forEach(lvl=>{
        let btn = document.getElementById("reward"+lvl);

        if(claimed.includes(lvl)){
            btn.innerText = "Claimed";
            btn.disabled = true;
        }
        else if(level >= lvl){
            btn.disabled = false;
        } 
        else {
            btn.disabled = true;
        }
    });
}

// ===== CLAIM REWARD =====
function claimReward(level){

    let claimed = JSON.parse(localStorage.getItem("claimedRewards")) || [];

    if(claimed.includes(level)){
        alert("Already claimed!");
        return;
    }

    claimed.push(level);
    localStorage.setItem("claimedRewards", JSON.stringify(claimed));

    alert("Reward for Level " + level + " claimed 🎉");

    loadRewards();
}

// INIT
document.addEventListener("DOMContentLoaded", loadRewards);
</script>

</body>
</html>
