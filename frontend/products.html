<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products | ShopXP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse products at ShopXP.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">🎮 ShopXP</div>

    <nav id="nav" class="nav">
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<main>

<section class="products">

    <article class="product-card">
        <img src="https://via.placeholder.com/200" alt="Smartphone" loading="lazy">
        <h3>Smartphone</h3>
        <p class="price">₹15,000</p>
        <div class="reward"></div>
        <button class="add-to-cart"
            data-id="1"
            data-name="Smartphone"
            data-price="15000"
            data-image="https://via.placeholder.com/200">
            Add to Cart
        </button>
    </article>

    <article class="product-card">
        <img src="https://via.placeholder.com/200" alt="Laptop" loading="lazy">
        <h3>Laptop</h3>
        <p class="price">₹55,000</p>
        <div class="reward"></div>
        <button class="add-to-cart"
            data-id="2"
            data-name="Laptop"
            data-price="55000"
            data-image="https://via.placeholder.com/200">
            Add to Cart
        </button>
    </article>

</section>

</main>

<footer>
    <Center>
    <p>© 2026 ShopXP. All Rights Reserved.</p>
    </Center>
</footer>

<script src="script.js"></script>

<script>
// Toggle menu
function toggleMenu() {
    document.getElementById("nav").classList.toggle("active");
}

// Update cart count
function updateCartCount() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    document.getElementById("cart-count").innerText = cart.length;
}

// Add to cart (same logic as index.html)
document.querySelectorAll(".add-to-cart").forEach(button => {
    button.addEventListener("click", () => {

        let product = {
            id: button.dataset.id,
            name: button.dataset.name,
            price: parseInt(button.dataset.price),
            image: button.dataset.image,
            qty: 1
        };

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        let existing = cart.find(item => item.id === product.id);

        if(existing) {
            existing.qty += 1;
        } else {
            cart.push(product);
        }

        localStorage.setItem("cart", JSON.stringify(cart));

        updateCartCount();

        alert(product.name + " added to cart!");
    });
});

// Init
updateCartCount();
</script>

</body>
</html>
