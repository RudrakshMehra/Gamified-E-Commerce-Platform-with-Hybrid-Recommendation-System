<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopEasy - Gamified E-commerce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShopXP - Best deals on electronics with a gamified shopping experience.">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ML badge on section heading */
        .ml-badge {
            font-size: 12px;
            background: linear-gradient(90deg, #2874f0, #6c47ff);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Skeleton loading cards */
        .suggestion-loading {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            padding: 0 20px;
        }

        .skeleton-card {
            height: 280px;
            border-radius: 12px;
            background: linear-gradient(90deg, #e8eaf0 25%, #f5f6fa 50%, #e8eaf0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">🎮 ShopXP</div>

    <nav id="nav" class="nav">
        <a href="profile.html">Profile</a>
        <a href="products.html">Products</a>
        <a href="reward.html">Level Up</a>
        <a href="about.html">About Us</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        <a href="login.html" id="nav-auth-link">Login</a>
    </nav>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<main>

<section class="hero">
    <h1>Level Up Your Shopping Experience</h1>
    <p>Earn rewards. Unlock deals. Shop smarter.</p>
    <a href="products.html" class="btn">Start Shopping</a>
</section>

<!-- CATEGORY BAR -->
<section class="categories">

    <div class="category active" onclick="filterProducts('all', event)">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png">
        <p>All</p>
    </div> 

    <div class="category" onclick="filterProducts('fashion', event)">
        <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
        <p>Fashion</p>
    </div>

    <div class="category" onclick="filterProducts('mobiles', event)">
        <img src="https://cdn-icons-png.flaticon.com/512/15/15874.png">
        <p>Mobiles</p>
    </div>

    <div class="category" onclick="filterProducts('beauty', event)">
        <img src="https://cdn-icons-png.flaticon.com/512/2331/2331970.png">
        <p>Beauty</p>
    </div>

    <div class="category" onclick="filterProducts('electronics', event)">
        <img src="https://cdn-icons-png.flaticon.com/512/1041/1041885.png">
        <p>Electronics</p>
    </div>

    <div class="category" onclick="filterProducts('appliances', event)">
        <img src="https://cdn-icons-png.flaticon.com/512/1995/1995574.png">
        <p>Appliances</p>
    </div>

</section>

<section id="products" class="products">
    <!-- Products loaded dynamically from DB via script.js -->
</section>

<!-- =========================
   SUGGESTED PRODUCTS
========================= -->
<section class="suggest-section">
    <h2>🔥 Suggested For You</h2>

    <div id="suggested-products" class="products"></div>
</section>

</main>

<footer>
    <center>
        <p>© 2026 ShopXP. All Rights Reserved.</p>
    </center>
</footer>

<script src="script.js"></script>

<script>
// ── Navbar: swap Login → Logout when user is logged in ──────────────────
(function updateNavAuth() {
  const link = document.getElementById("nav-auth-link");
  if (!link) return;
  const token = localStorage.getItem("token");
  if (token) {
    link.textContent = "Logout";
    link.href = "#";
    link.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      localStorage.removeItem("cart");
      window.location.reload();
    });
  }
})();
</script>

</body>
</html>
