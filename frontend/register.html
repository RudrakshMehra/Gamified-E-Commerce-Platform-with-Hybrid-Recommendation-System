<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | ShopXP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue:   #2563eb;
  --orange: #f97316;
  --dark:   #0f172a;
  --mid:    #1e293b;
  --muted:  #64748b;
  --error:  #ef4444;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  background: var(--mid);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  width: 100%;
  max-width: 440px;
  padding: 48px 40px;
  animation: fadeUp .4s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.brand { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: white; margin-bottom: 8px; }
.brand span { color: var(--orange); }
.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 36px; }

.field { margin-bottom: 20px; }

.field label {
  display: block;
  color: #94a3b8;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  letter-spacing: .4px;
  text-transform: uppercase;
}

.field input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 13px 16px;
  color: white;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  transition: border-color .2s;
  outline: none;
}

.field input:focus { border-color: var(--blue); }
.field input::placeholder { color: #475569; }

.error-msg { color: var(--error); font-size: 12px; margin-top: 5px; min-height: 16px; }

.success-bar {
  background: rgba(34,197,94,.12);
  border: 1px solid rgba(34,197,94,.3);
  color: #86efac;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 20px;
  display: none;
}

.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: transform .15s, background .2s;
  margin-top: 4px;
}

.btn-primary:hover  { background: #ea6c00; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.link-row { text-align: center; color: var(--muted); font-size: 14px; margin-top: 24px; }
.link-row a { color: var(--blue); text-decoration: none; font-weight: 600; }

.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #0f172a; color: white;
  padding: 14px 22px; border-radius: 50px;
  font-size: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  animation: slideUp .3s ease;
  border: 1px solid rgba(255,255,255,0.08);
  z-index: 999;
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">Shop<span>XP</span></div>
  <p class="subtitle">Create your account and start earning XP</p>

  <div class="success-bar" id="successMsg"></div>

  <div class="field">
    <label>Full Name</label>
    <input type="text" id="regName" placeholder="Jane Doe" autocomplete="name">
    <div class="error-msg" id="nameError"></div>
  </div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
    <div class="error-msg" id="emailError"></div>
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="regPassword" placeholder="Min 6 characters" autocomplete="new-password"
           onkeydown="if(event.key==='Enter') registerUser()">
    <div class="error-msg" id="passwordError"></div>
  </div>

  <button class="btn-primary" id="submitBtn" onclick="registerUser()">Create Account</button>

  <div class="link-row">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const API = (
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1" ||
  window.location.hostname === ""
) ? "http://localhost:5000/api" : "/api";

// ── HELPERS ─────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function clearErrors() {
  ["nameError", "emailError", "passwordError"].forEach(id => {
    document.getElementById(id).innerText = "";
  });
  const s = document.getElementById("successMsg");
  s.style.display = "none"; s.innerText = "";
}

// ── REGISTER ─────────────────────────────────────────────────────────────────
async function registerUser() {
  clearErrors();

  const name     = document.getElementById("regName").value.trim();
  const email    = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value.trim();

  // Client-side validation
  let valid = true;
  if (!name)                { document.getElementById("nameError").innerText = "Name is required"; valid = false; }
  if (!email.includes("@")) { document.getElementById("emailError").innerText = "Enter a valid email"; valid = false; }
  if (password.length < 6)  { document.getElementById("passwordError").innerText = "Min 6 characters"; valid = false; }
  if (!valid) return;

  // Disable button to prevent double-submit
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerText = "Creating account…";

  try {
    const res  = await fetch(`${API}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      // Show server error (e.g. "Email already in use")
      document.getElementById("emailError").innerText = data.message || "Registration failed";
      return;
    }

    // ── SUCCESS ──────────────────────────────────────────────────────────────
    // If the backend auto-logs in on register (returns token + user), store them
    if (data.token) {
      localStorage.setItem("token",   data.token);
      localStorage.setItem("user_id", data.user?.id   || data.user_id || "");
      localStorage.setItem("name",    data.user?.name || name);
      localStorage.setItem("email",   data.user?.email || email);
    }

    const s = document.getElementById("successMsg");
    s.innerText = "Account created! Redirecting to login…";
    s.style.display = "block";
    showToast("✅ Welcome to ShopXP!");
    setTimeout(() => window.location.href = "login.html", 1200);

  } catch (err) {
    console.error("Register error:", err);
    document.getElementById("emailError").innerText = "Server unreachable. Is the backend running?";
  } finally {
    btn.disabled = false;
    btn.innerText = "Create Account";
  }
}

// ── REDIRECT IF ALREADY LOGGED IN ───────────────────────────────────────────
if (localStorage.getItem("token")) window.location.href = "index.html";
</script>
</body>
</html>
