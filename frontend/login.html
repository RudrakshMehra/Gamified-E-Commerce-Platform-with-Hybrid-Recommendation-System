<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ShopXP</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f3f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Main Container */
.login-container {
    width: 800px;
    height: 500px;
    background: white;
    display: flex;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    border-radius: 8px;
    overflow: hidden;
}

/* Left Panel */
.left-panel {
    width: 40%;
    background: #2874f0;
    color: white;
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.left-panel h1 {
    font-size: 28px;
}

.left-panel p {
    font-size: 16px;
    line-height: 1.6;
}

.left-panel img {
    width: 80%;
    align-self: center;
}

/* Right Panel */
.right-panel {
    width: 60%;
    padding: 50px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.input-group {
    margin-bottom: 20px;
}

.input-group input {
    width: 100%;
    padding: 10px 5px;
    border: none;
    border-bottom: 1px solid #ccc;
    font-size: 14px;
    outline: none;
}

.input-group input:focus {
    border-bottom: 2px solid #2874f0;
}

/* Error Message */
.error {
    color: red;
    font-size: 13px;
    margin-bottom: 10px;
}

/* Button */
.login-btn {
    background: #fb641b;
    color: white;
    padding: 12px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    border-radius: 5px;
}

.login-btn:hover {
    background: #e55b14;
}

.create-account {
    margin-top: 25px;
    text-align: center;
}

.create-account a {
    text-decoration: none;
    color: #2874f0;
    font-weight: bold;
}

/* Responsive */
@media(max-width: 768px){
    .login-container {
        width: 95%;
        height: auto;
        flex-direction: column;
    }

    .left-panel, .right-panel {
        width: 100%;
    }
}
</style>

</head>
<body>

<div class="login-container">

    <!-- Left Panel -->
    <div class="left-panel">
        <div>
            <h1>Login</h1>
            <p>Get access to your Orders,<br>Wishlist and Recommendations</p>
        </div>

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="login">
    </div>

    <!-- Right Panel -->
    <div class="right-panel">

        <form onsubmit="handleLogin(event)">
            
            <div class="error" id="error-msg"></div>

            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Enter Email" required>
            </div>

            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <div class="create-account">
            New here? <a href="register.html">Create an account</a>
        </div>

    </div>

</div>

<script src="script.js"></script>

<script>
async function handleLogin(event){
    event.preventDefault();

    const email    = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();
    const errorBox = document.getElementById("error-msg");
    const btn      = event.target.querySelector("button[type=submit]");

    errorBox.style.color = "red";

    // Basic validation
    if (!email.includes("@")) {
        errorBox.innerText = "Enter a valid email";
        return;
    }

    if (password.length < 4) {
        errorBox.innerText = "Password must be at least 4 characters";
        return;
    }

    // ✅ Real backend call
    btn.disabled    = true;
    btn.textContent = "Logging in...";

    try {
        const res = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
            errorBox.innerText  = data.message || "Invalid email or password.";
            btn.disabled    = false;
            btn.textContent = "Login";
            return;
        }

        // ✅ Store user_id so ML recommendations are personalized
        localStorage.setItem("user", JSON.stringify({
            user_id: data.user?.id    || data.id,
            name:    data.user?.name  || data.name,
            email:   data.user?.email || email,
            token:   data.token
        }));

        errorBox.style.color = "green";
        errorBox.innerText   = "Login successful! Redirecting...";

        setTimeout(() => { window.location.href = "index.html"; }, 1000);

    } catch (err) {
        console.error("[ShopXP] Login error:", err);
        errorBox.innerText  = "Cannot reach server. Is the backend running on port 5000?";
        btn.disabled    = false;
        btn.textContent = "Login";
    }
}
</script>

</body>
</html>
