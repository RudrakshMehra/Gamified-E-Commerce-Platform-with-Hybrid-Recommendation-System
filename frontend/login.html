<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ShopXP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue:   #2563eb;
  --orange: #f97316;
  --dark:   #0f172a;
  --mid:    #1e293b;
  --muted:  #64748b;
  --light:  #f8fafc;
  --error:  #ef4444;
  --success:#22c55e;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  background: var(--mid);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  width: 100%;
  max-width: 440px;
  padding: 48px 40px;
  animation: fadeUp .4s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.brand {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: white;
  margin-bottom: 8px;
}

.brand span { color: var(--orange); }

.subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 36px;
}

.field { margin-bottom: 20px; }

.field label {
  display: block;
  color: #94a3b8;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  letter-spacing: .4px;
  text-transform: uppercase;
}

.field input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 13px 16px;
  color: white;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  transition: border-color .2s;
  outline: none;
}

.field input:focus { border-color: var(--blue); }
.field input::placeholder { color: #475569; }

.error-msg {
  color: var(--error);
  font-size: 12px;
  margin-top: 5px;
  min-height: 16px;
}

.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: transform .15s, background .2s;
  margin-top: 4px;
}

.btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
.btn-primary:active { transform: scale(.98); }

.divider {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin: 24px 0;
  position: relative;
}

.divider::before, .divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 42%;
  height: 1px;
  background: rgba(255,255,255,0.08);
}

.divider::before { left: 0; }
.divider::after  { right: 0; }

.link-row {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

.link-row a {
  color: var(--blue);
  text-decoration: none;
  font-weight: 600;
}

.link-row a:hover { text-decoration: underline; }

.global-error {
  background: rgba(239,68,68,.12);
  border: 1px solid rgba(239,68,68,.3);
  color: #fca5a5;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 20px;
  display: none;
}

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--dark);
  color: white;
  padding: 14px 22px;
  border-radius: 50px;
  font-size: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  animation: slideUp .3s ease;
  border: 1px solid rgba(255,255,255,0.08);
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">Shop<span>XP</span></div>
  <p class="subtitle">Welcome back — login to continue</p>

  <div class="global-error" id="loginError"></div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') loginUser()">
  </div>

  <button class="btn-primary" onclick="loginUser()">Login</button>

  <div class="divider">or</div>

  <div class="link-row">
    New here? <a href="register.html">Create account</a>
  </div>
</div>

<script>
const API = "https://shopxp-backend.onrender.com/api";

function showGlobalError(msg) {
  const el = document.getElementById("loginError");
  el.innerText = msg;
  el.style.display = "block";
}

function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

async function loginUser() {
  const email    = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value.trim();
  document.getElementById("loginError").style.display = "none";

  if (!email || !password) { showGlobalError("Please fill in all fields"); return; }

  try {
    const res  = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { showGlobalError(data.message || "Login failed"); return; }

    localStorage.setItem("token", data.token);
    localStorage.setItem("user",  JSON.stringify(data.user));
    // Clear any previous user's reward/XP state so rewards start fresh
    localStorage.removeItem("claimedRewards");
    // Seed XP for profile page
    localStorage.setItem("xp", data.user.xp ?? 0);

    showToast("Login successful 🎉");
    setTimeout(() => window.location.href = "index.html", 800);
  } catch {
    showGlobalError("Server unreachable. Make sure the backend is running.");
  }
}

// Redirect if already logged in
if (localStorage.getItem("token")) window.location.href = "index.html";
</script>
</body>
</html>
