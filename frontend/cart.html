<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart | ShopXP</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
}

/* ── Navbar ──────────────────────────────────────────────────────────── */
.navbar {
    background: #2874f0;
    color: white;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}
.navbar h2 { margin: 0; }
.navbar a { color: white; text-decoration: none; font-weight: bold; }
.navbar a:hover { text-decoration: underline; }

/* ── Layout ──────────────────────────────────────────────────────────── */
.cart-container {
    width: 90%;
    max-width: 1200px;
    margin: 30px auto;
    display: flex;
    gap: 20px;
}

/* ── Left panel ──────────────────────────────────────────────────────── */
.cart-left {
    flex: 2;
    background: white;
    padding: 20px;
    border-radius: 8px;
}

/* ── Skeleton loading ────────────────────────────────────────────────── */
.skeleton-item {
    display: flex;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid #f0f0f0;
    animation: shimmer 1.4s infinite;
}
.sk-img  { width: 120px; height: 120px; background: #e0e0e0; border-radius: 6px; flex-shrink: 0; }
.sk-lines { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.sk-line  { height: 14px; background: #e0e0e0; border-radius: 4px; }
.sk-line.short { width: 40%; }

@keyframes shimmer {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.5; }
}

/* ── Empty / error states ────────────────────────────────────────────── */
.empty-cart {
    text-align: center;
    padding: 60px 20px;
    color: #777;
    display: none;
}
.empty-cart a {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 24px;
    background: #2874f0;
    color: white;
    border-radius: 4px;
    text-decoration: none;
    font-weight: bold;
}

/* ── Cart item ────────────────────────────────────────────────────────── */
.cart-item-box {
    display: flex;
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
    align-items: center;
    gap: 16px;
}
.cart-item-left img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    flex-shrink: 0;
}
.cart-item-center { flex: 1; }
.cart-item-center h4 { margin: 0 0 6px; font-size: 15px; }
.item-price { font-size: 17px; font-weight: bold; color: #212121; margin: 0 0 4px; }
.item-mrp   { font-size: 13px; color: #878787; text-decoration: line-through; margin: 0 0 2px; }
.item-disc  { font-size: 13px; color: #388e3c; margin: 0 0 10px; }

.qty-controls { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
.qty-controls button {
    width: 32px; height: 32px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
}
.qty-controls button:hover { background: #f0f0f0; }
.qty-controls .qty-display { min-width: 28px; text-align: center; font-weight: bold; }

.remove-btn {
    background: none;
    border: none;
    color: #2874f0;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
}
.remove-btn:hover { text-decoration: underline; }

/* ── Right panel ─────────────────────────────────────────────────────── */
.cart-right {
    flex: 1;
    background: white;
    padding: 20px;
    height: fit-content;
    border-radius: 8px;
    position: sticky;
    top: 20px;
}
.price-title { font-weight: bold; margin-bottom: 15px; color: #878787; }
.price-row   { display: flex; justify-content: space-between; margin: 10px 0; font-size: 15px; }
.total-row   { border-top: 1px dashed #ccc; padding-top: 10px; font-weight: bold; font-size: 16px; }
.savings-msg { color: #388e3c; font-size: 14px; margin-top: 10px; }

.checkout-btn {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    background: #fb641b;
    border: none;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.2s;
}
.checkout-btn:hover    { background: #e55b14; }
.checkout-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* ── Order success overlay ────────────────────────────────────────────── */
.order-success {
    display: none;
    text-align: center;
    padding: 40px 20px;
    color: #333;
}
.order-success .tick { font-size: 56px; margin-bottom: 16px; }
.order-success h2    { color: #388e3c; margin-bottom: 8px; }
.order-success p     { color: #666; margin-bottom: 20px; font-size: 15px; }
.order-success a {
    display: inline-block;
    padding: 10px 28px;
    background: #2874f0;
    color: white;
    border-radius: 4px;
    text-decoration: none;
    font-weight: bold;
}

/* ── Toast ───────────────────────────────────────────────────────────── */
.toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #212121; color: white;
    padding: 12px 20px; border-radius: 24px;
    font-size: 14px; z-index: 999;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

/* ── Responsive ──────────────────────────────────────────────────────── */
@media(max-width: 768px) {
    .cart-container  { flex-direction: column; }
    .navbar          { flex-direction: column; text-align: center; }
    .navbar a        { margin-top: 10px; }
    .cart-right      { position: static; }
}
</style>
</head>
<body>

<div class="navbar">
    <h2>My Cart</h2>
    <a href="index.html">Continue Shopping</a>
</div>

<div class="cart-container">

    <!-- LEFT: items list -->
    <div class="cart-left">
        <!-- Skeleton (shown while loading) -->
        <div id="cart-skeleton">
            <div class="skeleton-item">
                <div class="sk-img"></div>
                <div class="sk-lines">
                    <div class="sk-line"></div>
                    <div class="sk-line short"></div>
                    <div class="sk-line short"></div>
                </div>
            </div>
            <div class="skeleton-item">
                <div class="sk-img"></div>
                <div class="sk-lines">
                    <div class="sk-line"></div>
                    <div class="sk-line short"></div>
                    <div class="sk-line short"></div>
                </div>
            </div>
        </div>

        <!-- Real items (injected by JS) -->
        <div id="cart-items"></div>

        <!-- Empty state -->
        <div id="empty-cart" class="empty-cart">
            🛒 Your cart is empty<br>
            <a href="products.html">Browse Products</a>
        </div>

        <!-- Post-order success message -->
        <div id="order-success" class="order-success">
            <div class="tick">✅</div>
            <h2>Order Placed!</h2>
            <p id="order-detail">Your order has been placed successfully.</p>
            <a href="index.html">Continue Shopping</a>
        </div>
    </div>

    <!-- RIGHT: price summary -->
    <div class="cart-right">
        <div class="price-title">PRICE DETAILS</div>
        <div class="price-row">
            <span>Price (MRP)</span>
            <span>₹<span id="mrp-total">0</span></span>
        </div>
        <div class="price-row">
            <span>Discount</span>
            <span style="color:#388e3c;">- ₹<span id="discount-total">0</span></span>
        </div>
        <div class="price-row total-row">
            <span>Total Amount</span>
            <span>₹<span id="cart-total">0</span></span>
        </div>
        <p class="savings-msg">You save ₹<span id="save-amount">0</span> on this order</p>

        <button class="checkout-btn" id="order-btn" onclick="goToCheckout()">
            PLACE ORDER
        </button>
    </div>

</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const API = "https://shopxp-backend.onrender.com/api";

const UPLOADS_BASE = API.replace("/api", "/uploads");
const token   = localStorage.getItem("token");
const headers = {
    "Content-Type": "application/json",
    ...(token ? { "Authorization": `Bearer ${token}` } : {})
};

// ── INIT ─────────────────────────────────────────────────────────────────────
window.onload = function () { loadCart(); };

// ── LOAD CART FROM DB ────────────────────────────────────────────────────────
async function loadCart() {
    if (token) {
        try {
            const res  = await fetch(`${API}/cart`, { headers });
            if (!res.ok) throw new Error("Cart API error");
            const data = await res.json();
            const serverCart = Array.isArray(data) ? data : (data.cart || data.items || []);
            const normalized = serverCart.map(item => ({
                id:    item.product_id || item.id,
                name:  item.name  || "Product",
                price: parseFloat(item.price || 0),
                mrp:   parseFloat(item.mrp   || item.price || 0),
                image: item.image || "",
                qty:   parseInt(item.quantity || item.qty || 1),
            }));
            localStorage.setItem("cart", JSON.stringify(normalized));
            hideSkeleton();
            renderCart(normalized);
        } catch (err) {
            console.warn("Cart API failed, using localStorage:", err);
            hideSkeleton();
            renderCart(getLocalCart());
        }
    } else {
        hideSkeleton();
        renderCart(getLocalCart());
    }
}

function getLocalCart() { return JSON.parse(localStorage.getItem("cart")) || []; }

// ── RENDER CART ITEMS ────────────────────────────────────────────────────────
function renderCart(cart) {
    const container = document.getElementById("cart-items");
    container.innerHTML = "";

    if (!cart || cart.length === 0) {
        document.getElementById("empty-cart").style.display = "block";
        document.getElementById("order-btn").disabled = true;
        updateSummary([]);
        return;
    }

    document.getElementById("empty-cart").style.display  = "none";
    document.getElementById("order-btn").disabled = false;

    cart.forEach(item => {
        const mrp   = item.mrp   || item.price;
        const price = item.price;
        const disc  = mrp > price ? Math.round(((mrp - price) / mrp) * 100) : 0;
        const imgSrc = item.image
            ? UPLOADS_BASE + "/" + item.image
            : "https://placehold.co/120x120?text=" + encodeURIComponent(item.name);

        const box = document.createElement("div");
        box.className  = "cart-item-box";
        box.dataset.id = item.id;
        box.innerHTML  = `
            <div class="cart-item-left">
                <img src="${imgSrc}" alt="${item.name}"
                     onerror="this.src='https://placehold.co/120x120?text=img'">
            </div>
            <div class="cart-item-center">
                <h4>${item.name}</h4>
                <p class="item-price">₹${price.toLocaleString("en-IN")}</p>
                ${mrp > price
                    ? `<p class="item-mrp">₹${mrp.toLocaleString("en-IN")}</p>
                       <p class="item-disc">${disc}% off</p>`
                    : ""}
                <div class="qty-controls">
                    <button onclick="changeQtyLocal('${item.id}', -1)">−</button>
                    <span class="qty-display" id="qty-${item.id}">${item.qty}</span>
                    <button onclick="changeQtyLocal('${item.id}', +1)">+</button>
                </div>
                <button class="remove-btn" onclick="removeItemLocal('${item.id}')">Remove</button>
            </div>`;
        container.appendChild(box);
    });
    updateSummary(cart);
}

// ── QTY / REMOVE ─────────────────────────────────────────────────────────────
async function changeQtyLocal(productId, delta) {
    let cart = getLocalCart();
    const item = cart.find(i => String(i.id) === String(productId));
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) { removeItemLocal(productId); return; }
    localStorage.setItem("cart", JSON.stringify(cart));
    document.getElementById(`qty-${productId}`).innerText = item.qty;
    updateSummary(cart);
    if (token) {
        try {
            await fetch(`${API}/cart`, { method:"POST", headers,
                body: JSON.stringify({ product_id: productId, quantity: item.qty }) });
        } catch(e) { console.warn("Qty sync failed:", e); }
    }
}

async function removeItemLocal(productId) {
    let cart = getLocalCart().filter(i => String(i.id) !== String(productId));
    localStorage.setItem("cart", JSON.stringify(cart));
    const box = document.querySelector(`.cart-item-box[data-id="${productId}"]`);
    if (box) box.remove();
    if (cart.length === 0) {
        document.getElementById("empty-cart").style.display = "block";
        document.getElementById("order-btn").disabled = true;
    }
    updateSummary(cart);
    showToast("Item removed");
    if (token) {
        try { await fetch(`${API}/cart/${productId}`, { method:"DELETE", headers }); }
        catch(e) { console.warn("Remove sync failed:", e); }
    }
}

// ── PRICE SUMMARY ─────────────────────────────────────────────────────────────
function updateSummary(cart) {
    let mrpTotal = 0, paidTotal = 0;
    cart.forEach(item => {
        const qty = item.qty || 1;
        mrpTotal  += (item.mrp || item.price) * qty;
        paidTotal += item.price * qty;
    });
    const discount = mrpTotal - paidTotal;
    document.getElementById("mrp-total").innerText      = Math.round(mrpTotal).toLocaleString("en-IN");
    document.getElementById("discount-total").innerText = Math.round(discount).toLocaleString("en-IN");
    document.getElementById("cart-total").innerText     = Math.round(paidTotal).toLocaleString("en-IN");
    document.getElementById("save-amount").innerText    = Math.round(discount).toLocaleString("en-IN");
}

// ── CHECKOUT → redirect to address page ──────────────────────────────────────
function goToCheckout() {
    const token = localStorage.getItem("token");
    if (!token) {
        showToast("Please login first 🔑");
        setTimeout(() => window.location.href = "login.html", 900);
        return;
    }
    const cart = getLocalCart();
    if (!cart || cart.length === 0) {
        showToast("Your cart is empty ⚠️");
        return;
    }
    window.location.href = "checkout.html";
}
// ── SKELETON / TOAST ─────────────────────────────────────────────────────────
function hideSkeleton() { const sk=document.getElementById("cart-skeleton"); if(sk) sk.style.display="none"; }
function showToast(msg) {
    const t=document.createElement("div"); t.className="toast"; t.innerText=msg;
    document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
</script>

</body>
</html>
