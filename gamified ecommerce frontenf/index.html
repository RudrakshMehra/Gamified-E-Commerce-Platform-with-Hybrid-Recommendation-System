<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopEasy - Gamified E-commerce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShopEasy - Best deals on electronics with a gamified shopping experience.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">🎮 ShopEasy</div>

    <nav id="nav" class="nav">

        <a href="profile.html">Profile</a>
        <a href="reward.html">Level Up</a>
        <a href="about.html">About Us</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        <a href="login.html">Login</a>
    </nav>

    <button class="menu-btn" aria-label="Toggle Menu" onclick="toggleMenu()">☰</button>
</header>

<main>

<section class="hero">
    <h1>Level Up Your Shopping Experience</h1>
    <p>Earn rewards. Unlock deals. Shop smarter.</p>
    <a href="#products" class="btn">Start Shopping</a>
</section>

<section id="products" class="products">

    <article class="product-card" data-id="1">
        <img src="https://via.placeholder.com/200" alt="Smartphone" loading="lazy">
        <h3>Smartphone</h3>
        <p class="price">₹15,000</p>
        <div class="reward">🎯 Earn 150 Points</div>
        <button class="add-to-cart" data-name="Smartphone" data-price="15000">
            Add to Cart
        </button>
    </article>

    <article class="product-card" data-id="2">
        <img src="https://via.placeholder.com/200" alt="Laptop" loading="lazy">
        <h3>Laptop</h3>
        <p class="price">₹55,000</p>
        <div class="reward">🎯 Earn 550 Points</div>
        <button class="add-to-cart" data-name="Laptop" data-price="55000">
            Add to Cart
        </button>
    </article>

    <article class="product-card" data-id="3">
        <img src="https://via.placeholder.com/200" alt="Headphones" loading="lazy">
        <h3>Headphones</h3>
        <p class="price">₹2,000</p>
        <div class="reward">🎯 Earn 20 Points</div>
        <button class="add-to-cart" data-name="Headphones" data-price="2000">
            Add to Cart
        </button>
    </article>

</section>

</main>

<footer>
    <p>© 2026 ShopEasy. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
