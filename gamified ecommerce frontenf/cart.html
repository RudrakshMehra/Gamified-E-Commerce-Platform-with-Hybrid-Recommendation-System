<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
}

/* Navbar */
.navbar {
    background: #2874f0;
    color: white;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar h2 {
    margin: 0;
}

.navbar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* Main Layout */
.cart-container {
    width: 90%;
    max-width: 1200px;
    margin: 30px auto;
    display: flex;
    gap: 20px;
}

/* Left Section - Items */
.cart-left {
    flex: 2;
    background: white;
    padding: 20px;
}

/* Individual Item */
.cart-item-box {
    display: flex;
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
}

.cart-item-left img {
    width: 120px;
}

.cart-item-center {
    margin-left: 20px;
}

.cart-item-center h4 {
    margin: 0 0 8px 0;
}

.qty-controls {
    margin: 10px 0;
}

.qty-controls button {
    padding: 5px 10px;
    margin: 0 5px;
    cursor: pointer;
}

.remove-btn {
    background: none;
    border: none;
    color: #2874f0;
    font-weight: bold;
    cursor: pointer;
}

/* Right Section - Price Details */
.cart-right {
    flex: 1;
    background: white;
    padding: 20px;
    height: fit-content;
}

.price-title {
    font-weight: bold;
    margin-bottom: 15px;
    color: #878787;
}

.price-row {
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
}

.total-row {
    border-top: 1px dashed #ccc;
    padding-top: 10px;
    font-weight: bold;
}

.checkout-btn {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #fb641b;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.checkout-btn:hover {
    background: #e55b14;
}

/* Responsive */
@media(max-width: 768px) {
    .cart-container {
        flex-direction: column;
    }
}
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h2>My Cart</h2>
    <a href="index.html">Continue Shopping</a>
</div>

<div class="cart-container">

    <!-- LEFT SIDE -->
    <div class="cart-left">
        <div id="cart-items"></div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="cart-right">
        <div class="price-title">PRICE DETAILS</div>

        <div class="price-row">
            <span>Price (MRP)</span>
            <span>₹<span id="mrp-total">0</span></span>
        </div>

        <div class="price-row">
            <span>Discount</span>
            <span style="color:green;">- ₹<span id="discount-total">0</span></span>
        </div>

        <div class="price-row total-row">
            <span>Total Amount</span>
            <span>₹<span id="cart-total">0</span></span>
        </div>

        <p style="color:green; font-size:14px; margin-top:10px;">
            You will save ₹<span id="save-amount">0</span> on this order
        </p>

        <button class="checkout-btn" onclick="checkout()">
            PLACE ORDER
        </button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
