<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f3f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Main Container */
.login-container {
    width: 800px;
    height: 500px;
    background: white;
    display: flex;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

/* Left Panel */
.left-panel {
    width: 40%;
    background: #2874f0;
    color: white;
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.left-panel h1 {
    font-size: 28px;
    margin-bottom: 15px;
}

.left-panel p {
    font-size: 16px;
    line-height: 1.6;
}

.left-panel img {
    width: 80%;
    align-self: center;
}

/* Right Panel */
.right-panel {
    width: 60%;
    padding: 50px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.input-group {
    margin-bottom: 20px;
}

.input-group input {
    width: 100%;
    padding: 10px 5px;
    border: none;
    border-bottom: 1px solid #ccc;
    font-size: 14px;
    outline: none;
}

.input-group input:focus {
    border-bottom: 2px solid #2874f0;
}

.login-btn {
    background: #fb641b;
    color: white;
    padding: 12px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}

.login-btn:hover {
    background: #e55b14;
}

.create-account {
    margin-top: 25px;
    text-align: center;
}

.create-account a {
    text-decoration: none;
    color: #2874f0;
    font-weight: bold;
}

/* Responsive */
@media(max-width: 768px){
    .login-container {
        width: 95%;
        height: auto;
        flex-direction: column;
    }

    .left-panel {
        width: 100%;
        text-align: center;
    }

    .right-panel {
        width: 100%;
    }
}
</style>

</head>
<body>

<div class="login-container">

    <!-- Left Blue Panel -->
    <div class="left-panel">
        <div>
            <h1>Login</h1>
            <p>Get access to your Orders,<br>Wishlist and Recommendations</p>
        </div>

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="login image">
    </div>

    <!-- Right White Panel -->
    <div class="right-panel">

        <form onsubmit="handleLogin(event)">

            <div class="input-group">
                <input type="text" id="loginEmail" placeholder="Enter Email">
            </div>

            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Enter Password">
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <div class="create-account">
            New here? <a href="register.html">Create an account</a>
        </div>

    </div>

</div>

<!-- Connect Your Existing Script -->
<script src="script.js"></script>

<script>
function handleLogin(event){
    event.preventDefault();
    login(); // Calls login() from your script.js
}
</script>

</body>
</html>
